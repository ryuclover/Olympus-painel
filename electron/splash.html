<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carregando Olympus Painel...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(99,102,241,0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg { width: 40px; height: 40px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; }
    .title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: #6b7280; margin-top: 6px; font-size: 14px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      margin-top: 36px;
      animation: spin 0.8s linear infinite;
    }
    .status { margin-top: 12px; color: #6b7280; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 30px rgba(99,102,241,0.3); } 50% { box-shadow: 0 0 60px rgba(99,102,241,0.6); } }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
  </div>
  <div class="title">Olympus Painel</div>
  <div class="subtitle">Sistema de Prospecção de Leads</div>
  <div class="spinner"></div>
  <div class="status" id="status">Iniciando servidor...</div>

  <script>
    const statuses = [
      'Iniciando servidor...',
      'Carregando módulos...',
      'Conectando ao banco de dados...',
      'Quase pronto...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % statuses.length;
      document.getElementById('status').textContent = statuses[idx];
    }, 2000);
  </script>
</body>
</html>
